name: Deploy Travel Assistant to LXC g4-apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Install Cloudflared on Runner
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy to LXC g4-apps via SSH (Cloudflare Tunnel)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Configure SSH to proxy through cloudflared
          cat << EOF >> ~/.ssh/config
          Host $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

          # Execute remote deployment commands
          ssh $DEPLOY_HOST "
            set -e
            echo '==> Deploying to /var/www/travelassistant...'
            mkdir -p /var/www/travelassistant
            cd /var/www/travelassistant

            if [ ! -d '.git' ]; then
              git clone https://github.com/adhityaakbar/travel-assistant.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            echo '==> Installing dependencies & building...'
            npm install
            npm run build

            echo '==> Reloading PM2 & Nginx...'
            pm2 delete travel-assistant 2>/dev/null || true
            pm2 start npm --name 'travel-assistant' -- start
            pm2 save
            systemctl reload nginx
            echo '==> Deployment successful!'
          "
