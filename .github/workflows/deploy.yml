name: Deploy Travel Assistant to LXC g4-apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        env:
          APP_SECRET: ${{ secrets.APP_SECRET || 'cicd-build-secret' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'cicd-build-jwt-secret' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://localhost/dummy' }}
        run: npm run build

      - name: Install Cloudflared on Runner
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy to LXC g4-apps via SSH (Cloudflare Tunnel)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Configure SSH to proxy through cloudflared
          cat << EOF >> ~/.ssh/config
          Host $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

          # Execute remote deployment commands
          ssh $DEPLOY_HOST "
            set -e
            echo '==> Deploying to /var/www/travelassistant...'
            mkdir -p /var/www/travelassistant
            cd /var/www/travelassistant

            if [ ! -d '.git' ]; then
              git clone https://github.com/adhityaakbar/travel-assistant.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            echo '==> Installing dependencies & building...'
            npm install
            APP_SECRET=\${APP_SECRET:-guardian8} JWT_SECRET=\${JWT_SECRET:-guardian8} npm run build

            echo '==> Reloading PM2 & Nginx...'
            pm2 delete travel-assistant 2>/dev/null || true
            pm2 start npm --name 'travel-assistant' -- start
            pm2 save
            systemctl reload nginx
            echo '==> Deployment successful!'
          "

      - name: Send Telegram Notification via Devina Bot
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEVINA_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEVINA_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MESSAGE="🚀 <b>Travel Assistant Deployment Successful!</b>%0A%0A<b>Repo:</b> ${{ github.repository }}%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Commit:</b> ${github_short_sha:-${{ github.sha }}}%0A<b>Actor:</b> ${{ github.actor }}%0A<b>Target:</b> LXC g4-apps"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=${MESSAGE}"
          else
            echo "Telegram credentials (DEVINA_TELEGRAM_BOT_TOKEN / DEVINA_TELEGRAM_CHAT_ID) not configured in GitHub Secrets."
          fi
