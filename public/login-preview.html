<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Revamp (Light Mode) - Telkomsel THE v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F4F6FB;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(0, 26, 65, 0.08);
      --card-shadow: 0 20px 40px -15px rgba(0, 26, 65, 0.08);
      --text-main: #0A1937;
      --text-sub: #5A6E85;
      --input-bg: #F0F4F9;
      --input-border: rgba(0, 26, 65, 0.12);
      --input-text: #0A1937;
      --input-placeholder: #8F9EAF;
      --glow-1: rgba(255, 0, 37, 0.12);
      --glow-2: rgba(253, 162, 43, 0.1);
      --icon-color: #5A6E85;
    }

    .dark {
      --bg-color: #001A41;
      --card-bg: rgba(10, 25, 55, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      --text-main: #FFFFFF;
      --text-sub: #94A3B8;
      --input-bg: rgba(255, 255, 255, 0.05);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-text: #FFFFFF;
      --input-placeholder: #64748B;
      --glow-1: rgba(255, 0, 37, 0.22);
      --glow-2: rgba(0, 0, 149, 0.3);
      --icon-color: #94A3B8;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .tsel-aurora-bg {
      background: 
        radial-gradient(circle at 50% 15%, var(--glow-1) 0%, transparent 55%),
        radial-gradient(circle at 85% 85%, var(--glow-2) 0%, transparent 60%),
        var(--bg-color);
    }

    .tsel-card-box {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
    }

    .tsel-input-field {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      transition: all 0.2s ease;
    }
    .tsel-input-field::placeholder {
      color: var(--input-placeholder);
    }
    .tsel-input-field:focus {
      border-color: #FF0025;
      box-shadow: 0 0 0 3px rgba(255, 0, 37, 0.15);
    }

    .tsel-btn-primary {
      background: linear-gradient(135deg, #FF0025 0%, #FDA22B 100%);
      transition: all 0.25s ease;
    }
    .tsel-btn-primary:hover {
      opacity: 0.95;
      box-shadow: 0 8px 20px -4px rgba(255, 0, 37, 0.4);
    }
    .tsel-btn-primary:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body id="appBody" class="tsel-aurora-bg min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">

  <!-- Floating Theme Switcher Badge -->
  <div class="absolute top-4 right-4 z-30 flex items-center gap-1.5 p-1.5 rounded-full bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 backdrop-blur-md shadow-xs">
    <button onclick="setTheme('light')" id="lightBtn" class="px-3 py-1 rounded-full text-xs font-semibold transition bg-red-500 text-white shadow-xs">
      ☀️ Light
    </button>
    <button onclick="setTheme('dark')" id="darkBtn" class="px-3 py-1 rounded-full text-xs font-semibold transition text-slate-500 dark:text-slate-400 hover:text-slate-900">
      🌙 Dark
    </button>
  </div>

  <!-- Ambient Glow -->
  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-red-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Login Card -->
  <div class="w-full max-w-sm tsel-card-box rounded-2xl p-6 sm:p-7 space-y-6 relative z-10">
    
    <!-- Logo & Title Section -->
    <div class="text-center space-y-2.5">
      <div class="w-12 h-12 mx-auto rounded-xl bg-gradient-to-tr from-[#FF0025] to-[#FDA22B] flex items-center justify-center text-white shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="16" height="13" x="4" y="7" rx="2"></rect>
          <path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path>
          <path d="M9 11v5"></path>
          <path d="M15 11v5"></path>
        </svg>
      </div>

      <div>
        <h1 class="text-xl font-bold tracking-tight text-[var(--text-main)]">Travel Assistant</h1>
        <p class="text-xs text-[var(--text-sub)] mt-1">Masukkan passcode untuk melanjutkan</p>
      </div>
    </div>

    <!-- Form -->
    <form onsubmit="event.preventDefault(); handleLoginPreview();" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-[var(--text-sub)] mb-1.5">
          Passcode Aplikasi
        </label>
        <div class="relative">
          <input
            id="passcodeInput"
            type="password"
            value="travel2026"
            placeholder="Masukkan passcode"
            class="w-full pl-9 pr-10 py-3 tsel-input-field rounded-xl text-sm font-medium outline-none"
            required
          />
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-3.5 text-[var(--icon-color)]">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" onclick="togglePasscodeVisibility()" class="absolute right-3 top-3.5 text-[var(--icon-color)] hover:opacity-100 transition">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="flex items-center text-xs text-[var(--text-sub)]">
        <label class="flex items-center gap-2 cursor-pointer font-medium select-none">
          <input
            type="checkbox"
            checked
            class="w-4 h-4 rounded border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-red-600 focus:ring-red-500 transition cursor-pointer"
          />
          <span>Ingat sesi saya</span>
        </label>
      </div>

      <button
        id="submitBtn"
        type="submit"
        data-hermes-send="Terapkan desain login revamp ini ke App.jsx"
        class="w-full py-3 tsel-btn-primary text-white text-sm font-semibold rounded-xl shadow flex items-center justify-center gap-2 cursor-pointer"
      >
        <span>Masuk</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <!-- Feedback Banner -->
    <div id="feedbackMsg" class="hidden p-2.5 rounded-lg bg-red-500/10 border border-red-500/20 text-red-600 dark:text-red-300 text-xs text-center font-medium">
      ✅ Siap diterapkan ke `src/App.jsx`.
    </div>

    <!-- Security Footer -->
    <div class="pt-3 border-t border-slate-200 dark:border-white/5 flex items-center justify-center text-[11px] text-[var(--text-sub)]">
      <span class="font-mono">v1.4.6</span>
    </div>

  </div>

  <script>
    function setTheme(mode) {
      const body = document.getElementById('appBody');
      const lightBtn = document.getElementById('lightBtn');
      const darkBtn = document.getElementById('darkBtn');

      if (mode === 'dark') {
        body.classList.add('dark');
        darkBtn.className = "px-3 py-1 rounded-full text-xs font-semibold transition bg-red-500 text-white shadow-xs";
        lightBtn.className = "px-3 py-1 rounded-full text-xs font-semibold transition text-slate-500 hover:text-slate-900";
      } else {
        body.classList.remove('dark');
        lightBtn.className = "px-3 py-1 rounded-full text-xs font-semibold transition bg-red-500 text-white shadow-xs";
        darkBtn.className = "px-3 py-1 rounded-full text-slate-400 hover:text-white font-semibold transition";
      }
    }

    function togglePasscodeVisibility() {
      const input = document.getElementById('passcodeInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function handleLoginPreview() {
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('feedbackMsg');
      btn.innerHTML = `<span>Memproses...</span>`;
      setTimeout(() => {
        btn.innerHTML = `<span>Masuk</span>`;
        msg.classList.remove('hidden');
      }, 500);
    }
  </script>
</body>
</html>
