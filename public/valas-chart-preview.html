<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Assistant — Valas Mini Chart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              navy: '#060B14',
              card: '#0D1627',
              border: 'rgba(255, 255, 255, 0.08)',
              red: '#FF0025',
              orange: '#FDA22B',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #060B14; color: #f8fafc; font-family: "Plus Jakarta Sans", sans-serif; }
    .card-glass { background: #0D1627; border: 1px solid rgba(255, 255, 255, 0.08); }
    .card-active { border-color: rgba(253, 162, 43, 0.5); background: linear-gradient(180deg, rgba(253, 162, 43, 0.08) 0%, rgba(13, 22, 39, 1) 100%); }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 max-w-md mx-auto space-y-4">

  <!-- Header Section -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-base font-bold text-white flex items-center gap-2">
        💱 Valas & Exchange Rate
      </h1>
      <p class="text-xs text-slate-400">Update real-time mata uang asing</p>
    </div>
    <span class="px-2 py-0.5 text-[10px] font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-md">LIVE</span>
  </div>

  <!-- Tombol Simpan Ke Riwayat -->
  <button class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-red-600 to-orange-500 text-white font-semibold text-xs shadow-lg shadow-orange-500/20 flex items-center justify-center gap-2">
    <span>🔖</span> Simpan ke Riwayat Konversi
  </button>

  <!-- MINI CHART TREND MATAA UANG (SELECTED CURRENCY) -->
  <div class="card-glass rounded-2xl p-4 space-y-3 relative overflow-hidden">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🇰🇷</span>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="text-sm font-bold text-white">KRW / IDR</span>
            <span class="text-[10px] font-mono px-1.5 py-0.2 bg-white/10 text-slate-300 rounded">7 Hari</span>
          </div>
          <div class="text-xs text-slate-400">South Korean Won</div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-sm font-extrabold text-white font-mono">Rp 13.40</div>
        <div class="text-[11px] font-bold text-emerald-400 font-mono flex items-center justify-end gap-0.5">
          <span>▲</span> +0.42% <span class="text-[9px] text-slate-400 font-normal">(7D)</span>
        </div>
      </div>
    </div>

    <!-- Mini Sparkline Graph (SVG) -->
    <div class="pt-2">
      <svg class="w-full h-16" viewBox="0 0 300 60" fill="none">
        <defs>
          <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FDA22B"/>
            <stop offset="100%" stop-color="#22c55e"/>
          </linearGradient>
        </defs>

        <!-- Grid Lines Background -->
        <line x1="0" y1="15" x2="300" y2="15" stroke="white" stroke-opacity="0.04" stroke-dasharray="3 3"/>
        <line x1="0" y1="35" x2="300" y2="35" stroke="white" stroke-opacity="0.04" stroke-dasharray="3 3"/>

        <!-- Area Fill -->
        <path d="M0 45 Q 40 50, 80 30 T 160 35 T 240 15 T 300 10 L 300 60 L 0 60 Z" fill="url(#chartGradient)" />

        <!-- Main Trend Line -->
        <path d="M0 45 Q 40 50, 80 30 T 160 35 T 240 15 T 300 10" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Active Data Point Pulse -->
        <circle cx="300" cy="10" r="4" fill="#22c55e" />
        <circle cx="300" cy="10" r="8" fill="#22c55e" fill-opacity="0.3" class="animate-ping" />
      </svg>
      <div class="flex justify-between text-[9px] font-mono text-slate-500 pt-1">
        <span>3 OKT</span>
        <span>5 OKT</span>
        <span>7 OKT</span>
        <span>HARI INI</span>
      </div>
    </div>
  </div>

  <!-- CURRENCY LIST CARDING (HORIZONTAL SCROLL) -->
  <div class="space-y-1.5">
    <div class="text-xs font-semibold text-slate-400 px-1">Pilih Mata Uang:</div>
    <div class="flex gap-2.5 overflow-x-auto pb-2 scrollbar-none">
      
      <!-- KRW (Active Selected) -->
      <div class="card-glass card-active rounded-xl p-3 min-w-[120px] flex-shrink-0 cursor-pointer">
        <div class="flex items-center justify-between">
          <span class="text-xs font-extrabold text-white font-mono">KRW</span>
          <span class="text-base">🇰🇷</span>
        </div>
        <div class="text-xs font-bold text-slate-200 mt-2 font-mono">Rp 13.4</div>
        <div class="text-[9px] text-emerald-400 font-mono mt-0.5">▲ +0.42%</div>
      </div>

      <!-- EUR -->
      <div class="card-glass rounded-xl p-3 min-w-[120px] flex-shrink-0 cursor-pointer hover:border-slate-600 transition">
        <div class="flex items-center justify-between">
          <span class="text-xs font-extrabold text-white font-mono">EUR</span>
          <span class="text-base">🇪🇺</span>
        </div>
        <div class="text-xs font-bold text-slate-200 mt-2 font-mono">Rp 20.029</div>
        <div class="text-[9px] text-emerald-400 font-mono mt-0.5">▲ +0.15%</div>
      </div>

      <!-- GBP -->
      <div class="card-glass rounded-xl p-3 min-w-[120px] flex-shrink-0 cursor-pointer hover:border-slate-600 transition">
        <div class="flex items-center justify-between">
          <span class="text-xs font-extrabold text-white font-mono">GBP</span>
          <span class="text-base">🇬🇧</span>
        </div>
        <div class="text-xs font-bold text-slate-200 mt-2 font-mono">Rp 23.659</div>
        <div class="text-[9px] text-red-400 font-mono mt-0.5">▼ -0.28%</div>
      </div>

      <!-- AUD -->
      <div class="card-glass rounded-xl p-3 min-w-[120px] flex-shrink-0 cursor-pointer hover:border-slate-600 transition">
        <div class="flex items-center justify-between">
          <span class="text-xs font-extrabold text-white font-mono">AUD</span>
          <span class="text-base">🇦🇺</span>
        </div>
        <div class="text-xs font-bold text-slate-200 mt-2 font-mono">Rp 12.480</div>
        <div class="text-[9px] text-emerald-400 font-mono mt-0.5">▲ +0.05%</div>
      </div>

    </div>
  </div>

</body>
</html>
